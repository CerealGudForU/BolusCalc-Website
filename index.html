<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ead9">
<meta name="description" content="Insulin bolus calculator with the correction dose limited to 0.1 unit per kg of body weight.">
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Bolus Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow centered column. Settings group, meal group, then a live result card. Palette: muted stone, bone and black, in the manner of Fear of God. */
:root {
  --bg: #e9ead9;
  --surface: #f3f4e8;
  --fg: #272b1d;
  --muted: #5a6048;
  --line: #b7bb9f;
  --accent: #56692f;
  --accent-fg: #f3f4e8;
  --cap-bg: #f2e5c3;
  --cap-fg: #4d3a14;
  --cap-line: #c9a95f;
  --err: #a33a2a;
  color-scheme: light;
  --font: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 400; font-size: 16px; line-height: 1.45;
  padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 1.15rem; font-weight: 500; margin: 0; letter-spacing: 0.22em; text-transform: uppercase; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; font-weight: 400; letter-spacing: 0.03em; }
fieldset { border: 1px solid var(--line); background: var(--surface); border-radius: 0; margin: 0; padding: 18px 16px 16px; min-width: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
legend { padding: 0 6px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label { font-size: 1.05rem; font-weight: 500; letter-spacing: 0.04em; line-height: 1.25; }
.unit { color: var(--muted); font-weight: 400; letter-spacing: 0.03em; text-transform: none; font-size: 0.95rem; display: block; }
input { font: inherit; font-size: 1.15rem; font-family: var(--mono); width: 100%; box-sizing: border-box; min-width: 0;
  padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); }
input::placeholder { color: var(--muted); opacity: 0.6; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: var(--err); }
.result { background: var(--surface); border: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
.big { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
.big .num { font-family: var(--font); font-weight: 400; font-size: 5rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.big .u { font-size: 0.8rem; color: var(--muted); font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
.big-label { text-align: center; font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.placeholder { text-align: center; color: var(--muted); padding: 8px 0; font-weight: 400; letter-spacing: 0.03em; }
.cap { background: var(--cap-bg); color: var(--cap-fg); border: 1px solid var(--cap-line); padding: 12px 14px; font-size: 0.9rem; }
dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 0.88rem; border-top: 1px solid var(--line); padding-top: 14px; }
dt { color: var(--muted); font-weight: 400; } dd { margin: 0; font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; padding: 12px 18px; border-radius: 0; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; }
button.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 12px 4px; }
.foot { font-size: 0.82rem; color: var(--muted); font-weight: 400; letter-spacing: 0.02em; margin: 0; }
</style>

</head>
<body>
<main>
  <header>
    <h1>Insulin Bolus Calculator</h1>
    <p class="sub">The correction dose is limited to 0.1 unit per kg of body weight.</p>
  </header>

  <form id="f" novalidate>
    <div style="display:flex;flex-direction:column;gap:20px">
      <fieldset>
        <legend>Your settings (saved on this device)</legend>
        <div class="field"><label for="cr">Carb ratio <span class="unit">g per 1 unit</span></label>
          <input id="cr" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"></div>
        <div class="field"><label for="isf">Sensitivity <span class="unit">mmol/L per 1 unit</span></label>
          <input id="isf" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"></div>
        <div class="field"><label for="tbg">Target BG <span class="unit">mmol/L</span></label>
          <input id="tbg" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"></div>
        <div class="field"><label for="wt">Weight <span class="unit">kg</span></label>
          <input id="wt" inputmode="decimal" autocomplete="off" placeholder="e.g. 32"></div>
      </fieldset>
      <fieldset>
        <legend>This meal</legend>
        <div class="field"><label for="cbg">Current BG <span class="unit">mmol/L</span></label>
          <input id="cbg" inputmode="decimal" autocomplete="off" placeholder="e.g. 9.4"></div>
        <div class="field"><label for="carbs">Meal carbs <span class="unit">g</span></label>
          <input id="carbs" inputmode="decimal" autocomplete="off" placeholder="e.g. 45"></div>
      </fieldset>
    </div>
  </form>

  <section class="result" aria-live="polite" id="out"></section>

  <div class="actions">
    <button type="button" id="clear">Clear meal</button>
    <button type="button" class="link" id="forget">Forget saved settings</button>
  </div>

  <p class="foot">This tool is an aid, not medical advice. Always follow your diabetes team's instructions. It does not account for insulin already on board.</p>
</main>

<script>
(function () {
  var KEY = "bolus-settings-v1";
  var saved = ["cr", "isf", "tbg", "wt"];
  var $ = function (id) { return document.getElementById(id); };
  var all = ["cr", "isf", "tbg", "wt", "cbg", "carbs"];

  function num(id) {
    var s = $(id).value.trim().replace(",", ".");
    if (s === "") return null;
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }
  function fmt(tenths) { return (tenths / 10).toFixed(1); }

  // All dosing math is done in tenths of a unit (integers) so rounding down never drifts.
  function calc(v) {
    var meal = v.carbs / v.cr;
    var corr = Math.max(0, (v.cbg - v.tbg) / v.isf);
    var corrT = Math.floor(corr * 10 + 1e-9);
    var capT = Math.floor(v.wt + 1e-9); // 0.1 U/kg = 1 tenth of a unit per kg, applies to the correction only
    var capped = corrT > capT;
    var corrUsed = capped ? capT / 10 : corr;
    var finalT = Math.floor((meal + corrUsed) * 10 + 1e-9);
    return { meal: meal, corr: corr, corrT: corrT, capT: capT, capped: capped, finalT: finalT };
  }

  function row(k, val) { return "<dt>" + k + "</dt><dd>" + val + "</dd>"; }

  function render() {
    var v = {}, missing = false, bad = false;
    all.forEach(function (id) {
      v[id] = num(id);
      var el = $(id);
      var invalid = v[id] !== null && (isNaN(v[id]) || v[id] < 0 || ((id === "cr" || id === "isf" || id === "wt") && v[id] === 0));
      el.setAttribute("aria-invalid", invalid ? "true" : "false");
      if (v[id] === null) missing = true;
      if (invalid) bad = true;
    });
    var out = $("out");
    if (bad) { out.innerHTML = '<p class="placeholder">Check the highlighted fields. Use positive numbers only.</p>'; return; }
    if (missing) { out.innerHTML = '<p class="placeholder">Fill in all six fields to see the dose.</p>'; return; }

    var r = calc({ cr: v.cr, isf: v.isf, tbg: v.tbg, wt: v.wt, cbg: v.cbg, carbs: v.carbs });
    var html = '<div class="big-label">Recommended dose</div>' +
      '<div class="big"><span class="num">' + fmt(r.finalT) + '</span><span class="u">units</span></div>';
    if (r.capped) {
      html += '<div class="cap">The correction dose of ' + fmt(r.corrT) + ' units is above the correction limit of ' + fmt(r.capT) +
        ' units (0.1 unit per kg). Only ' + fmt(r.capT) + ' units of correction were used.</div>';
    }
    html += "<dl>" +
      row("Meal carbs ÷ ratio", r.meal.toFixed(2) + " U") +
      row("Correction (calculated)", r.corr.toFixed(2) + " U") +
      row("Correction limit (" + v.wt + " kg × 0.1)", fmt(r.capT) + " U") +
      row("Total (rounded down)", fmt(r.finalT) + " U") + "</dl>";
    out.innerHTML = html;
  }

  // Settings are kept until forgotten. Meal fields are kept for 1 hour only, so an old blood sugar is never reused by mistake.
  var MEAL_KEY = "bolus-meal-v1", MEAL_MS = 60 * 60 * 1000;
  function save() {
    try {
      var o = {}; saved.forEach(function (id) { o[id] = $(id).value; });
      localStorage.setItem(KEY, JSON.stringify(o));
      localStorage.setItem(MEAL_KEY, JSON.stringify({ cbg: $("cbg").value, carbs: $("carbs").value, t: Date.now() }));
    } catch (e) {}
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || "{}");
      saved.forEach(function (id) { if (typeof o[id] === "string") $(id).value = o[id]; });
      var m = JSON.parse(localStorage.getItem(MEAL_KEY) || "{}");
      if (m && typeof m.t === "number" && Date.now() - m.t < MEAL_MS) {
        if (typeof m.cbg === "string") $("cbg").value = m.cbg;
        if (typeof m.carbs === "string") $("carbs").value = m.carbs;
      }
    } catch (e) {}
  }

  all.forEach(function (id) {
    $(id).addEventListener("input", function () { save(); render(); });
  });
  $("f").addEventListener("submit", function (e) { e.preventDefault(); });
  $("clear").addEventListener("click", function () { $("cbg").value = ""; $("carbs").value = ""; save(); render(); $("cbg").focus(); });
  $("forget").addEventListener("click", function () {
    saved.forEach(function (id) { $(id).value = ""; });
    try { localStorage.removeItem(KEY); localStorage.removeItem(MEAL_KEY); } catch (e) {}
    render();
  });

  load(); render();
})();
</script>

</body>
</html>
